x-collector: &collector
  # Write bind-mounted files as the host operator instead of container root.
  # Override these values for a host account whose UID/GID is not 1000.
  user: "${URBAN_UID:-1000}:${URBAN_GID:-1000}"
  restart: unless-stopped
  environment:
    URBAN_SYSTEM_CONFIG: /app/config.json
    URBAN_SAVE_FOLDER: /data
    URBAN_BACKUP_FOLDER: /backups
    URBAN_OWM_LOCATIONS: /app/extractor_modules/weather/owm_locations.txt
    URBAN_PURPLEAIR_SENSORS: /app/extractor_modules/air/nearby_purpleair_sensors.csv
    URBAN_CCTV_LOCATIONS: /app/extractor_modules/cctv/cctv.kml
    TZ: America/Los_Angeles
  volumes:
    - ./config.json:/app/config.json:ro
    - type: bind
      source: ${URBAN_SAVE_FOLDER_HOST:?Run ./docker-start instead of docker compose directly}
      target: /data
    - type: bind
      source: ${URBAN_BACKUP_FOLDER_HOST:?Run ./docker-start instead of docker compose directly}
      target: /backups

services:
  gdelt-gkg:
    <<: *collector
    build:
      context: .
      target: gdelt
    image: urban-data-collector-gdelt:local
    command: ["python", "-m", "extractor_modules.operations.scheduler", "--cron", "*/15 * * * *", "--", "python", "-m", "extractor_modules.gdelt.gdelt_extract"]

  pems:
    <<: *collector
    build:
      context: .
      target: pems
    image: urban-data-collector-pems:local
    command: ["python", "-m", "extractor_modules.operations.scheduler", "--cron", "0 8 * * *", "--", "python", "-m", "extractor_modules.pems.pems_extract"]

  cctv:
    <<: *collector
    build:
      context: .
      target: cctv
    image: urban-data-collector-cctv:local
    command: ["python", "-m", "extractor_modules.operations.scheduler", "--cron", "*/15 * * * *", "--", "python", "-m", "extractor_modules.cctv.calcctv_extract"]

  alertcalifornia:
    <<: *collector
    build:
      context: .
      target: alertcalifornia
    image: urban-data-collector-alertcalifornia:local
    shm_size: 2gb
    environment:
      URBAN_SYSTEM_CONFIG: /app/config.json
      URBAN_SAVE_FOLDER: /data
      URBAN_BACKUP_FOLDER: /backups
      URBAN_OWM_LOCATIONS: /app/extractor_modules/weather/owm_locations.txt
      URBAN_PURPLEAIR_SENSORS: /app/extractor_modules/air/nearby_purpleair_sensors.csv
      URBAN_CCTV_LOCATIONS: /app/extractor_modules/cctv/cctv.kml
      TZ: America/Los_Angeles
      CHROMEDRIVER: /usr/bin/chromedriver
    command: ["python", "-m", "extractor_modules.operations.scheduler", "--cron", "*/30 * * * *", "--", "python", "-m", "extractor_modules.alertcalifornia.alertcalifornia_extract"]

  weather:
    <<: *collector
    build:
      context: .
      target: weather
    image: urban-data-collector-weather:local
    command: ["python", "-m", "extractor_modules.operations.scheduler", "--cron", "0 * * * *", "--", "python", "-m", "extractor_modules.weather.weather_extract"]

  air:
    <<: *collector
    build:
      context: .
      target: air
    image: urban-data-collector-air:local
    volumes:
      - ./config.json:/app/config.json:ro
      - type: bind
        source: ${URBAN_SAVE_FOLDER_HOST:?Run ./docker-start instead of docker compose directly}
        target: /data
      - type: bind
        source: ${URBAN_BACKUP_FOLDER_HOST:?Run ./docker-start instead of docker compose directly}
        target: /backups
      - ./extractor_modules/air/nearby_purpleair_sensors.csv:/app/extractor_modules/air/nearby_purpleair_sensors.csv
    command: ["python", "-m", "extractor_modules.operations.scheduler", "--cron", "0 * * * *", "--", "python", "-m", "extractor_modules.air.air_extract"]

  twitter-email:
    <<: *collector
    build:
      context: .
      target: email
    image: urban-data-collector-email:local
    command: ["python", "-m", "extractor_modules.operations.scheduler", "--cron", "*/5 * * * *", "--", "python", "-m", "extractor_modules.email.generate_csv", "--scheduled"]

  citizen-email:
    <<: *collector
    build:
      context: .
      target: email
    image: urban-data-collector-email:local
    command: ["python", "-m", "extractor_modules.operations.scheduler", "--cron", "*/30 * * * *", "--", "python", "-m", "extractor_modules.email.citizen_scrape"]

  cleanup:
    <<: *collector
    build:
      context: .
      target: operations
    image: urban-data-collector-operations:local
    command: ["python", "-m", "extractor_modules.operations.scheduler", "--cron", "0 8 * * *", "--", "python", "-m", "extractor_modules.operations.archive"]

  data-alert:
    <<: *collector
    build:
      context: .
      target: operations
    image: urban-data-collector-operations:local
    command: ["python", "-m", "extractor_modules.operations.scheduler", "--cron", "0 10 * * *", "--", "python", "-m", "extractor_modules.operations.missing_data_alert"]
