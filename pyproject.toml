[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-observations"
version = "0.1.0"
description = "Urban sensor extractors and the normalized REPORT interchange contract"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["extractor_modules*", "observation_contract*", "utilities*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.csv", "*.kml", "*.jpg"]
